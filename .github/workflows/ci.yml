name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  BIN: window-memory.exe

jobs:
  audit:
    name: Auditoría de dependencias
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: rustsec/audit-check@69366f33c96575abad1ee0dba8212993eecbe998 # v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

  check:
    name: Formato y análisis
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - name: Formato
        run: cargo fmt --all --check
      - name: Clippy
        run: cargo clippy --all-targets --locked -- -D warnings
      - name: Pruebas
        run: cargo test --locked

  build:
    name: Compilar release
    needs: [audit, check]
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - name: Compilar
        run: cargo build --release --locked
      - name: Comprobar el binario
        shell: pwsh
        run: |
          $exe = "target/release/$env:BIN"
          if (-not (Test-Path $exe)) { throw "no se generó $exe" }
          $size = (Get-Item $exe).Length
          Write-Host ("tamaño: {0:N0} bytes" -f $size)
          # Umbral inferior: solo detecta binarios truncados o vacíos.
          # Referencia local: 499 712 bytes en release; no es un límite máximo.
          if ($size -lt 250000) { throw "el binario parece incompleto" }

          $info = (Get-Item $exe).VersionInfo
          Write-Host "descripcion: $($info.FileDescription)"
          Write-Host "producto: $($info.ProductName)"
          if (-not $info.FileDescription) { throw "falta FileDescription" }
          if (-not $info.ProductName) { throw "falta ProductName" }
          if ($info.OriginalFilename -ne $env:BIN) {
            throw "OriginalFilename no coincide: $($info.OriginalFilename)"
          }

          $version = (& $exe --version | Out-String).Trim()
          Write-Host "version: $version"
          if (-not $version.StartsWith("window-memory ")) { throw "salida de --version inesperada" }
      - name: Sumas de verificación
        shell: pwsh
        run: |
          $hash = (Get-FileHash "target/release/$env:BIN" -Algorithm SHA256).Hash.ToLower()
          "$hash  $env:BIN" | Out-File -Encoding ascii target/release/SHA256SUMS.txt
          Get-Content target/release/SHA256SUMS.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: window-memory-windows-x64
          path: |
            target/release/window-memory.exe
            target/release/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 30

  release:
    name: Publicar release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - name: Compilar
        run: cargo build --release --locked
      - name: Sumas de verificación
        shell: pwsh
        run: |
          $hash = (Get-FileHash "target/release/$env:BIN" -Algorithm SHA256).Hash.ToLower()
          "$hash  $env:BIN" | Out-File -Encoding ascii target/release/SHA256SUMS.txt
      - name: Publicar
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          files: |
            target/release/window-memory.exe
            target/release/SHA256SUMS.txt
          generate_release_notes: true